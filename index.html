<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tokn — Solana Meme Token Intelligence</title>
<style>
:root{
  --bg:#05070d; --bg2:rgba(17,21,34,.6); --panel:rgba(18,24,40,.5); --panel2:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.08); --txt:#f2f6ff; --muted:#9aa7c0; --dim:#6b7690;
  --green:#2ee6a8; --red:#ff5d73; --amber:#ffb020; --blue:#5db6ff; --purple:#b79bff;
  --fire:linear-gradient(135deg,#ff7a45,#ff3d5a);
  --ok:linear-gradient(135deg,#2ee6a8,#12b981);
  --good:linear-gradient(135deg,#5db6ff,#4c6fff);
  --warn:linear-gradient(135deg,#ffb020,#ff7a45);
  --dang:linear-gradient(135deg,#ff5d73,#ff2f4f);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;position:relative;
}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#05040f}
.bg .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 26s ease-in-out infinite}
.orb1{width:520px;height:520px;background:radial-gradient(circle,#7c5cff,transparent 70%);top:-120px;left:-100px}
.orb2{width:460px;height:460px;background:radial-gradient(circle,#0fd3ff,transparent 70%);top:20%;right:-160px;animation-delay:-8s}
.orb3{width:420px;height:420px;background:radial-gradient(circle,#ff3d7a,transparent 70%);bottom:-140px;left:30%;animation-delay:-16s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.08)}}
.grid-overlay{position:fixed;inset:0;z-index:-1;opacity:.35;pointer-events:none;
  background-image:linear-gradient(rgba(120,140,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,255,.05) 1px,transparent 1px);
  background-size:44px 44px;}
.glass{background:var(--bg);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.35);}
.app{max-width:1280px;margin:0 auto;padding:20px 24px 120px;position:relative;z-index:1}

.topnav{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#0fd3ff,#7c5cff);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(124,92,255,.45);overflow:hidden;position:relative}
.brand b{font-size:19px;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#b79bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.4px}
.navtabs{margin-left:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:14px;flex-wrap:wrap}
.navtabs button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
.navtabs button:hover{color:var(--txt)}
.navtabs button.active{background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(15,211,255,.16));color:var(--txt);box-shadow:inset 0 0 0 1px rgba(150,130,255,.3)}
.navtabs button svg{width:16px;height:16px;flex-shrink:0}
.live-badge{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--green);background:rgba(46,230,168,.1);border:1px solid rgba(46,230,168,.3);padding:6px 12px;border-radius:20px;white-space:nowrap}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(46,230,168,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,230,168,.7)}70%{box-shadow:0 0 0 9px rgba(46,230,168,0)}100%{box-shadow:0 0 0 0 rgba(46,230,168,0)}}
.pagehead h1{font-size:25px;font-weight:800;letter-spacing:.2px}
.pagehead p{color:var(--muted);font-size:13.5px;margin-top:3px}

.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.25),transparent 70%);transform:translate(30px,-30px)}
.stat .lab{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.stat .val{font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .val em{font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.up{color:var(--green)} .down{color:var(--red)}

.card{background:var(--bg);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(18px);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer;white-space:nowrap;user-select:none}
thead th.sorted{color:var(--blue)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer;transition:background .12s}
tbody tr.clickable:hover{background:rgba(255,255,255,.04)}
.token{display:flex;align-items:center;gap:12px}
.ticon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.35);color:#fff;letter-spacing:.5px;position:relative;overflow:hidden}
.ticon::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 55%);}
.ticon .em{position:absolute;right:2px;bottom:0;font-size:13px;font-weight:700;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));z-index:2}
.ticon .ticonimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;z-index:0}
.ticon .tletter{position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.bigchart{width:100%;height:150px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-top:16px;display:block}
.chartwrap{position:relative;margin-top:16px}
.chartwrap .chhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.chartwrap .chlabel{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.chartwrap .chg{font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px}
.chg.up{background:rgba(46,230,168,.14);color:var(--green)}
.chg.down{background:rgba(255,93,115,.14);color:var(--red)}
.hlrow{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.hlrow .hl{flex:1;min-width:90px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;text-align:center}
.hlrow .hl .k{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.hlrow .hl .v{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.tdesc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.socrow{display:flex;gap:8px;flex-wrap:wrap}
.socchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--txt);text-decoration:none;transition:.15s}
.socchip:hover{background:rgba(255,255,255,.1);border-color:var(--blue)}
.socchip .ic{width:16px;height:16px}
.socchip.dex{background:linear-gradient(135deg,rgba(93,182,255,.2),rgba(124,92,255,.2));border-color:rgba(150,130,255,.35)}
.tbanner{position:relative;height:120px;border-radius:14px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.tbanner img{width:100%;height:100%;object-fit:cover}
.tbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(5,7,13,.85))}
.chgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chgrid .cc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;text-align:center}
.chgrid .cc .k{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.chgrid .cc .v{font-size:12.5px;font-weight:800}
.tname{font-weight:700;font-size:14px}
.taddr{color:var(--dim);font-size:11px;font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.3px;display:inline-block;vertical-align:middle}
.tag.new{background:rgba(255,61,90,.16);color:#ff8ea0}
.tag.hot{background:rgba(255,176,32,.16);color:#ffcf7a}
.tag.steady{background:rgba(46,230,168,.14);color:#7ff0c8}
.pct{font-size:11px;font-weight:700;margin-top:2px}
.pct.up{color:var(--green)}.pct.down{color:var(--red)}
.riskpill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px}
.risk-low{background:rgba(46,230,168,.14);color:#5bf0b4}
.risk-med{background:rgba(255,176,32,.15);color:#ffcf7a}
.risk-high{background:rgba(255,93,115,.15);color:#ff8ea0}
.score-ring{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.spark{display:flex;align-items:flex-end;gap:2px;height:32px}
.spark i{width:5px;background:var(--purple);border-radius:2px;opacity:.9}
.sparkline{display:block;max-width:110px;width:100%;filter:drop-shadow(0 0 5px currentColor)}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}

.feedbar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.pill:hover{color:var(--txt);border-color:rgba(255,255,255,.2)}
.pill.on{background:linear-gradient(135deg,#5db6ff,#4c6fff);border-color:transparent;color:#04122b}
.pill svg{width:14px;height:14px}
.spacer{flex:1}
.auto-refresh{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(3,4,10,.72);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 16px}
.modal.open{display:flex}
.modal-card{background:var(--bg);border:1px solid var(--line);border-radius:22px;max-width:880px;width:100%;padding:26px;animation:pop .22s ease;backdrop-filter:blur(20px)}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-x{float:right;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.sec h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.score-big{width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.score-big b{font-size:28px;line-height:1}
.score-big span{font-size:9px;font-weight:800;letter-spacing:.8px;opacity:.85}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sbox{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px}
.sbox .l{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sbox .v{font-size:17px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.sbox .d{font-size:12px;font-weight:700;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row .bl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.bar-row .bl b{font-weight:600}
.bar-row .bl .w{color:var(--muted);font-size:11px}
.track{height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:6px;transition:width .6s ease}
.signal{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px}
.signal .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.signal .ic.good{background:rgba(46,230,168,.14)} .signal .ic.warn{background:rgba(255,176,32,.15)} .signal .ic.dang{background:rgba(255,93,115,.15)} .signal .ic.b{background:rgba(93,182,255,.14)} .signal .ic.p{background:rgba(183,155,255,.15)}
.signal .st{font-weight:700;font-size:13px}
.signal .sd{font-size:12px;color:var(--muted)}
.signal .sv{margin-left:auto;font-weight:800;font-size:12px}
.signal .siglink{color:var(--blue);text-decoration:none;font-weight:800;font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid rgba(93,182,255,.4);background:rgba(93,182,255,.1);transition:.15s}
.signal .siglink:hover{background:rgba(93,182,255,.25);border-color:var(--blue)}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.wallet{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(14px)}
.wallet .whead{display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer}
.wscore{width:44px;height:44px;border-radius:50%;background:var(--good);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.wname{font-weight:700}
.waddr{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:12px}
.kpis>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.kpis b{display:block;font-size:14px}
.kpis span{color:var(--muted);font-size:11px}
.wchip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;margin:0 6px 6px 0}

.rule{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rule:last-child{border-bottom:none}
.alert-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.alert-ic.good{background:rgba(46,230,168,.14)} .alert-ic.warn{background:rgba(255,176,32,.15)} .alert-ic.dang{background:rgba(255,93,115,.15)} .alert-ic.b{background:rgba(93,182,255,.14)}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slid{position:absolute;cursor:pointer;inset:0;background:#28304a;border-radius:24px;transition:.2s}
.slid:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slid{background:linear-gradient(135deg,#2ee6a8,#12b981)}
.switch input:checked+.slid:before{transform:translateX(20px)}

.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.plan{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px;position:relative;backdrop-filter:blur(14px)}
.plan.featured{border-color:var(--purple);box-shadow:0 0 0 1px rgba(183,155,255,.5),0 10px 40px rgba(124,92,255,.15)}
.plan h3{font-size:16px}
.plan .price{font-size:30px;font-weight:800;margin:8px 0}
.plan .price small{font-size:13px;color:var(--muted);font-weight:500}
.plan ul{list-style:none;margin:14px 0;font-size:13px;color:var(--muted)}
.plan ul li{padding:6px 0;display:flex;gap:9px}
.plan ul li::before{content:"✓";color:var(--green);font-weight:800}
.featured-badge{position:absolute;top:-12px;left:22px;background:var(--fire);color:#fff;font-size:10px;font-weight:800;padding:4px 12px;border-radius:20px;box-shadow:0 4px 16px rgba(255,61,90,.4)}

.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-weight:600;font-size:13px;padding:10px 16px;border-radius:11px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:var(--fire);border:none;color:#fff;box-shadow:0 6px 20px rgba(255,61,90,.3)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.empty{padding:44px;text-align:center;color:var(--muted);font-size:14px}
.watch-badge{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--panel2);border:1px solid var(--line);user-select:none;transition:.15s}
.watch-badge svg{width:16px;height:16px}
.watch-badge.watched{background:rgba(255,176,32,.16);border-color:var(--amber);color:var(--amber)}
.flg{font-size:13px;line-height:1}
.flags{display:flex;gap:4px;justify-content:center;cursor:pointer;user-select:none}
.flags:hover .flg{opacity:.75}
.pop{position:fixed;z-index:600;min-width:250px;max-width:320px;background:rgba(20,24,34,.96);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);backdrop-filter:blur(10px);font-size:13px}
.pop-head{font-weight:800;font-size:14px;margin-bottom:6px}
.pop-s{color:var(--muted);font-size:12px;margin-bottom:12px}
.pop-bars{display:flex;flex-direction:column;gap:8px}
.pop-bar{display:flex;align-items:center;gap:8px}
.pop-bar .pl{width:54px;font-size:12px;color:var(--muted);flex-shrink:0}
.pop-bar .pt{flex:1;height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}
.pop-bar .pf{height:100%;border-radius:5px}
.pop-bar .pv{width:34px;text-align:right;font-weight:700;font-size:12px;flex-shrink:0}
.pop-note{color:var(--dim);font-size:11px;margin-top:12px}
.launchrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.launchrow:last-child{border-bottom:none}
.launch-conf{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.alert-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert-box input{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:13px}
.alert-box input:focus{outline:none;border-color:var(--blue)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#0e1220;border:1px solid var(--green);color:var(--txt);padding:14px 22px;border-radius:13px;font-size:13.5px;font-weight:600;z-index:100;display:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{display:block;animation:pop .25s ease}
.disclaim{font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:46px;color:var(--muted)}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--purple);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-nav{display:none}

@media (max-width:860px){
  .app{padding:14px 14px 110px}
  .navtabs{margin-left:0;width:100%;justify-content:space-between;overflow-x:auto}
  .two-col{grid-template-columns:1fr}
  .brand b{font-size:16px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,13,24,.9);border-top:1px solid var(--line);z-index:40;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}

/* ==================== SCORING ==================== */
function score(t){
  var mc=+t.mc||0,vol=+t.vol||0,buys=+t.buys||0,sells=+t.sells||0,liq=+t.liq||0;
  var buyRatio=buys+sells>0?buys/(buys+sells)*100:50;
  var ageH=(Date.now()-(t.created||0))/3600000;
  var opp=0;
  opp+=Math.min(25,mc/3e6*25);
  opp+=Math.min(20,vol/(mc||1)*2000);
  opp+=Math.min(20,ageH<24?(ageH<=0?20:20-12*ageH/24):2);
  opp+=Math.min(15,(buyRatio-50)*0.6);
  opp+=Math.min(20,vol>mc*0.3?20:vol>mc*0.1?10:4);
  opp=Math.max(2,Math.min(98,Math.round(opp)));
  var risk=0;
  if(mc<5e4)risk+=35; else if(mc<2e5)risk+=25; else if(mc<1e6)risk+=15; else if(mc<5e6)risk+=8;
  risk+=Math.min(20,(100-buyRatio)*0.4);
  if(ageH<0.5)risk+=12; else if(ageH<2)risk+=6;
  if(vol>0&&vol/(mc||1)>3)risk+=15;
  risk=Math.max(2,Math.min(96,Math.round(risk)));
  return {opp:opp,risk:risk,riskLvl:riskLvl(risk),momentum:Math.round(opp*0.6+buyRatio*0.4),buyRatio:Math.round(buyRatio),ageH:ageH};
}

        }).catch(function(){return null});

      FEED=(rows||[]).filter(Boolean).filter(function(x){return x.mc>0});

function refreshMajors(){
  if(typeof fetch!=='function')return;
  var jobs=SEED.map(function(s){return fetch('https://api.dexscreener.com/latest/dex/tokens/'+s.address).then(function(r){return r.json()}).then(function(d){
    var pairs=(d.pairs||[]).filter(function(p){return p.chainId==='solana'});
    if(!pairs.length)return null;
    var best=pairs.reduce(function(a,b){return ((b.liquidity||{}).usd||0)>((a.liquidity||{}).usd||0)?b:a});
    var logo=(best.info&&best.info.imageUrl)||((best.baseToken||{}).logoURI)||'';
    var info=best.info||{};
    var ch24=(best.priceChange&&best.priceChange.h24)||s.ch24||0;
    var ch1=(best.priceChange&&best.priceChange.h1)||s.ch1||0;
    var ch6=(best.priceChange&&best.priceChange.h6)||s.ch6||0;
    var desc=info.description||s.desc||'';
    var web=info.websites||s.web||[];
    var soc=info.socials||s.soc||[];
    var banner=(typeof info.banner==='string'&&info.banner)||((info.header&&info.header.imageUrl)||'')||s.banner||'';
    return {sym:s.sym,logo:logo,desc:desc,web:web,soc:soc,ch24:ch24,ch1:ch1,ch6:ch6,banner:banner,mc:best.marketCap||s.mc,liq:(best.liquidity||{}).usd||s.liq,vol:(best.volume||{}).h24||s.vol,price:best.priceUsd,buys:((best.txns||{}).h24||{}).buys||s.buys,sells:((best.txns||{}).h24||{}).sells||s.sells,created:best.pairCreatedAt||s.created};
  }).catch(function(){return null})});
  Promise.all(jobs).then(function(rs){rs.forEach(function(r,i){if(r){SEED[i].mc=r.mc;SEED[i].liq=r.liq;SEED[i].vol=r.vol;SEED[i].price=r.price;SEED[i].buys=r.buys;SEED[i].sells=r.sells;SEED[i].created=r.created;if(r.logo)SEED[i].logo=r.logo;if(r.ch24!==undefined)SEED[i].ch24=r.ch24;if(r.ch1!==undefined)SEED[i].ch1=r.ch1;if(r.ch6!==undefined)SEED[i].ch6=r.ch6;if(r.banner)SEED[i].banner=r.banner;if(r.desc)SEED[i].desc=r.desc;if(r.web)SEED[i].web=r.web;if(r.soc)SEED[i].soc=r.soc;if(r.price>0)recHist(r.sym,r.price)}});if(view==='radar'&&feedMode==='majors')render();});
}
function fetchLive(){fetchFeed();refreshMajors()}

  var data=feedData();

  if(filter==='new')list=list.filter(function(x){return isNew(x.t,x.s)});
  if(filter==='hot')list=list.filter(function(x){return x.s.momentum>=70});

  if(filter==='audited')list=list.filter(function(x){return auditSig(x.t).audited});
  if(filter==='locked')list=list.filter(function(x){return auditSig(x.t).lpLocked});

  var col=sort.col,dir=sort.dir;

          +'<div class="pill '+(feedMode==='majors'?'on':'')+'" onclick="setFeed(\'majors\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H6"/></svg>Majors</div>';
  var f=[['all','All'],['new','New'],['hot','Hot'],['lowrisk','Low Risk'],['audited','Audited'],['locked','LP Locked'],['watch','Watch']];

  }
  return '<div class="card"><div class="filters" style="display:flex;gap:8px;padding:14px 18px;flex-wrap:wrap;align-items:center">'+pills+'<span style="width:1px;height:22px;background:var(--line);margin:0 4px"></span>'+ph+'<span class="spacer"></span><span class="auto-refresh">↻ auto 25s</span></div>'+body+'</div>';
}

function statStrip(){
  var data=feedData();var tot=0,vol=0,liq=0;data.forEach(function(t){tot+=+t.mc||0;vol+=+t.vol||0;liq+=+t.liq||0});
  function box(lab,val){return '<div class="stat"><div class="lab">'+lab+'</div><div class="val">'+val+'</div></div>'}
  return box('Total MC','$'+money(tot).slice(1))+box('24h Volume',money(vol))+box('Tracked',data.length)+box('Pooled Liq',money(liq));
}

function changeCell(k,v){v=Number(v)||0;var up=v>=0;return '<div class="cc"><div class="k">'+k+'</div><div class="v" style="color:'+(up?'var(--green)':'var(--red)')+'">'+(v>0?'+':'')+v.toFixed(2)+'%</div></div>'}
/* 24h range boxes in the top stat grid — computed from live session history + real 24h change */
function rangeBoxes(t){
  var h=PRICE_HIST[t.sym]||[];
  var hi=h.length?Math.max.apply(null,h):0, lo=h.length?Math.min.apply(null,h):0;
  var have=t.price>0?fmtPrice(hi):money(hi);
  var low=t.price>0?fmtPrice(lo):money(lo);
  return sbox('24h High',have)+sbox('24h Low',low)+sbox('24h Change',changePct(t.ch24));
}
function changePct(v){v=Number(v)||0;var up=v>=0;return '<span style="color:'+(up?'var(--green)':'var(--red)')+'" class="'+(up?'up':'down')+'">'+(v>0?'▲ +':'▼ ')+v.toFixed(2)+'%</span>'} 

/* holder concentration — capture when available, else estimate from market cap */
function holderStats(t){
  var holders=t.holders||Math.round(Math.max(50,t.mc/1200));
  var top=t.top10;
  if(top===undefined)top=Math.max(12,Math.min(70,Math.round(42-t.mc/1e7*10)));
  var risk=top>=45?'high':top>=30?'med':'low';
  return {holders:holders,top:top,risk:risk};
}
function holderHTML(t){
  var h=holderStats(t);
  var g=growthRate(t);
  return '<div class="sec"><h3>👥 Holders</h3><div class="stat-grid">'
    +'<div class="sbox"><div class="l">Holder count</div><div class="v">'+money(h.holders).replace('$','')+'</div></div>'
    +'<div class="sbox"><div class="l">New holders/hr</div><div class="v" style="color:'+(g>=0?'var(--green)':'var(--red)')+'">'+(g>=0?'+':'')+g+'/hr</div><div class="d">'+(g>=10?'Accelerating':g>=0?'Growing':'Declining')+'</div></div>'
    +'<div class="sbox"><div class="l">Top 10 concentration</div><div class="v" style="color:'+riskColor(t.top10===undefined?60:h.top)+'">'+h.top+'%</div><div class="d">'+h.risk.toUpperCase()+' risk</div></div></div>'
    +'<div class="bar-row"><div class="bl"><b>Top 10 holds</b><span class="w">'+h.top+'%</span></div><div class="track"><div class="fill" style="width:'+h.top+'%;background:'+(h.risk==='high'?'var(--red)':h.risk==='med'?'var(--amber)':'var(--green)')+'"></div></div></div></div>';
}
function growthRate(t){
  if(t.growth!==undefined)return t.growth;
  var ageH=(Date.now()-(t.created||0))/3600000;
  var rate=Math.round((t.holders||50)/Math.max(1,ageH)*0.6);
  return Math.max(-20,Math.min(120,rate));
}
function fmtNum(n){n=Math.round(n||0);if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(0)+'K';return ''+n}
/* contract audit + LP-lock signals from pair info when available, else estimated */
function auditSig(t){
  if(t.auditLock!==undefined)return t.auditLock;
  var mc=t.mc||0;
  var audited=(t.audited===true)||mc>=5e6;
  var lpLocked=(t.lpLocked===true)||(mc>=5e6||(t.liq||0)>=30000);
  return {audited:audited,lpLocked:lpLocked};
}

}

/* ==================== SCANNER ==================== */
function scannerHTML(){
  return '<div class="card" style="padding:24px"><h2 style="font-size:18px;margin-bottom:6px">🔍 Token Scanner</h2>'
    +'<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Paste any Solana address to see live Opportunity & Risk.</p>'
    +'<div class="alert-box"><input id="scanInput" placeholder="Paste a Solana contract address"><button class="btn primary" onclick="doScan()">Analyze</button></div>'
    +'<div id="scanResult"></div></div>';
}
function doScan(){
  var v=($('#scanInput').value||'').trim();if(!v){toast('Enter an address');return}
  var t=SEED.filter(function(x){return x.address.toLowerCase()===v.toLowerCase()||x.sym.toLowerCase()===v.toLowerCase()})[0];
  if(!t)t={sym:'LIVE',name:'Pasted token',address:v,mc:0,liq:0,vol:0,price:0,buys:0,sells:0,created:Date.now()};
  $('#scanResult').innerHTML=scanCard(t);toast('Analyzing…');
}
function scanCard(t){var sc=score(t);
  return '<div class="card" style="margin-top:18px;padding:22px"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'
    +iconHTML(t,52)
    +'<div><div style="font-size:19px;font-weight:800">$'+esc(t.sym)+'</div><div class="taddr">'+esc(t.address)+'</div></div>'
    +'<div style="margin-left:auto;display:flex;gap:12px"><div class="score-big" style="background:'+ringColor(sc.opp)+'"><b>'+sc.opp+'</b><span>OPP.</span></div><div class="score-big" style="background:'+riskColor(sc.risk)+'"><b>'+sc.risk+'</b><span>RISK</span></div></div></div>'
    +'<div style="margin-top:14px">'+sig('🔥','warn','Momentum','Live velocity & buy pressure',''+sc.momentum)+'</div>'
    +'<div style="margin-top:8px">'+sig('🛡️','good','Risk','MC '+money(t.mc)+' · Liq '+money(t.liq),riskPill(sc.riskLvl))+'</div>'
    +'<div class="disclaim">Live on-chain snapshot — automated estimate, not financial advice.</div></div>';
}

function toggleAlert(id,on){enabled[id]=on;toast(on?'Alert enabled':'Alert disabled')}
function setLaunchEnabled(on){launchConf.enabled=on;toast(on?'Auto-track enabled':'Auto-track disabled')}
function setLaunchMinMC(v){launchConf.minMC=+v||0;toast('Launch MC threshold set')}

/* ==================== WATCHLIST ==================== */
function wlSortVal(t,c){if(c==='growth')return growthRate(t);if(c==='audit'){var a=auditSig(t);return (a.audited?1:0)+(a.lpLocked?1:0)}return t[c]||0}
function watchlistHTML(){
  var live=FEED.filter(function(t){return watchlist.indexOf(t.sym)>=0});
  var coins=SEED.filter(function(t){return watchlist.indexOf(t.sym)>=0}).concat(live);
  var seen={};coins=coins.filter(function(t){if(seen[t.address])return false;seen[t.address]=true;return true});
  if(!coins.length)return '<div class="card"><div class="empty">Nothing tracked yet — tap the ★ on any token, or let the radar auto-add new launches.</div></div>';
  var col=sort.col,dir=sort.dir;
  var ranks={low:0,med:1,high:2};
  coins=coins.slice().sort(function(a,b){
    var va,vb;
    if(col==='risk'){va=ranks[score(a).riskLvl];vb=ranks[score(b).riskLvl]}
    else if(col==='audit'){va=wlSortVal(a,col);vb=wlSortVal(b,col)}
    else if(col==='growth'){va=wlSortVal(a,col);vb=wlSortVal(b,col)}
    else{va=wlSortVal(a,col);vb=wlSortVal(b,col)}
    return (va-vb)*dir;
  });
  var rows=coins.map(function(t){var sc=score(t);
    return '<tr class="clickable" onclick="openToken(\''+t.sym.replace(/'/g,'')+'\')"><td><div class="token">'+iconHTML(t,40)+'<div class="tname">$'+esc(t.sym)+(t.isLive?'<span class="tag new">NEW</span>':'')+'</div></div></td><td>'+money(t.mc)+'</td><td>'+ageFmt(t.created)+'</td><td>'+riskPill(sc.riskLvl)+'</td><td>'+flagHTML(t)+'</td><td style="color:'+(growthRate(t)>=0?'var(--green)':'var(--red)')+'"><b>'+ (growthRate(t)>=0?'+':'') + growthRate(t) + '/h</b></td><td><div class="score-ring" style="background:'+ringColor(sc.opp)+'">'+sc.opp+'</div></td><td>'+watchBadge(t.sym)+'</td></tr>';
  }).join('');
  function wh(c,label){return '<th class="'+(col===c?'sorted':'')+'" onclick="sortBy(\''+c+'\')">'+label+(col===c?(dir>0?' ↑':' ↓'):'')+'</th>'}
  return '<div class="card"><div style="overflow-x:auto"><table><thead><tr><th>Token</th>'+wh('mc','Market Cap')+wh('created','Age')+wh('risk','Risk')+wh('audit','Audit/LP')+wh('growth','Holders/hr')+wh('opp','Opp.')+'<th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ==================== RENDER ==================== */
var TITLES={
 radar:['Live Radar','Fresh pump.fun launches & top Solana memes, ranked live'],
 scanner:['Scanner','Paste any address for live analysis'],
 wallets:['Smart Wallets','Track historically successful wallets'],
 alerts:['Alerts','Custom on-chain notification rules'],
 watchlist:['Watchlist','Tokens you are tracking'],
 pricing:['Pro Plans','Freemium — PRO unlocks real-time']
};
function render(){
  var t=TITLES[view];
  $('#pagehead').innerHTML='<h1>'+t[0]+'</h1><p>'+t[1]+'</p>';
  $('#statStrip').innerHTML=statStrip();
  var html='';
  if(view==='radar')html=radarHTML();
  else if(view==='scanner')html=scannerHTML();
  else if(view==='wallets')html=walletsHTML();
  else if(view==='alerts')html=alertsHTML();
  else if(view==='watchlist')html=watchlistHTML();
  else if(view==='pricing')html=pricingHTML();
  $('#content').innerHTML=html;
}
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-view')===v)});render()}

function showPop(sym,ev){
  var el=$('#pop');
  el.innerHTML=holderDistHTML(sym);
  el.style.display='block';
  var r=ev.target.closest('.flags').getBoundingClientRect();
  var pw=el.offsetWidth||260, ph=el.offsetHeight||200;
  var left=Math.min(r.left,window.innerWidth-pw-8), top=r.bottom+6;
  if(top+ph>window.innerHeight-8)top=r.top-ph-6;
  el.style.left=Math.max(4,left)+'px';el.style.top=Math.max(4,top)+'px';
  el.dataset.sym=sym;
}
function closePop(){$('#pop').style.display='none'}
function togglePop(sym,ev){
  var el=$('#pop');
  if(el.style.display==='block'&&el.dataset.sym===sym){closePop();return}
  showPop(sym,ev);
}

/* events */
document.addEventListener('click',function(e){
  var pf=e.target.closest?e.target.closest('.flags'):null;
  if(pf){e.stopPropagation();togglePop(pf.getAttribute('data-pop'),e);return}
  var pop=e.target.closest?e.target.closest('#pop'):null;
  if(pop){e.stopPropagation();return}
  closePop();
  var wb=e.target.closest?e.target.closest('.watch-badge'):null;
  if(wb){e.stopPropagation();toggleWatch(wb.getAttribute('data-w'));render();return}
  var nav=e.target.closest?e.target.closest('[data-view]'):null;
  if(nav)setView(nav.getAttribute('data-view'));
});
render();
/* seed initial history for majors so charts render immediately */
SEED.forEach(function(t){if(!PRICE_HIST[t.sym])seedHist(t.sym,t.price||(t.mc/1e8))});
fetchLive();
setInterval(fetchLive,25000);
</script>
